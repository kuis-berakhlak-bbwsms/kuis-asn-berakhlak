
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuis ASN BerAKHLAK BBWSMS</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f7fb;
margin:0;
padding:0;
color:#1f2937;
}

.container{
max-width:1000px;
margin:auto;
padding:20px;
}

.header{
background:#0b376d;
color:white;
padding:30px;
border-radius:20px;
margin-bottom:20px;
}

.card{
background:white;
padding:20px;
border-radius:16px;
margin-bottom:20px;
box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

input{
width:100%;
padding:12px;
margin-bottom:12px;
border-radius:10px;
border:1px solid #ccc;
}

button{
background:#0b376d;
color:white;
border:none;
padding:12px 18px;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

.question{
margin-bottom:20px;
padding:15px;
border:1px solid #ddd;
border-radius:12px;
background:#fff;
}

.timer{
font-size:24px;
font-weight:bold;
color:#b91c1c;
margin-bottom:20px;
}

.result{
background:#ecfdf5;
padding:20px;
border-radius:12px;
margin-top:20px;
display:none;
}

.correct{
border-left:6px solid green;
padding-left:10px;
margin-top:10px;
}

.wrong{
border-left:6px solid red;
padding-left:10px;
margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>Kuis ASN BerAKHLAK</h1>
<p>BBWS Mesuji Sekampung</p>
</div>

<div class="card" id="startSection">

<h2>Identitas Peserta</h2>

<input type="text" id="nama" placeholder="Nama Lengkap">
<input type="text" id="nip" placeholder="NIP">
<input type="text" id="unitkerja" placeholder="Unit Kerja">

<p><b>Durasi:</b> 30 Menit</p>
<p><b>Total Soal:</b> 30</p>
<p><b>Total Nilai:</b> 100</p>

<button onclick="startQuiz()">Mulai Kuis</button>

</div>

<div id="quizSection" style="display:none;">

<div class="timer" id="timer">30:00</div>

<form id="quizForm">

<div id="questions"></div>

<button type="button" onclick="finishQuiz()">Selesai</button>

</form>

</div>

<div class="result" id="resultBox"></div>

</div>

<script>

const questions = [
{
q:"Seorang pegawai menemukan kesalahan data laporan kegiatan yang sudah hampir dikirim ke pimpinan. Sikap terbaik adalah...",
options:["Tetap mengirim","Menyembunyikan kesalahan","Memperbaiki data terlebih dahulu","Menunggu orang lain"],
answer:2,
point:4,
explain:"Akuntabilitas menuntut laporan yang benar dan dapat dipertanggungjawabkan."
},
{
q:"Pegawai tetap melayani masyarakat dengan sopan meskipun mendapat komplain keras.",
options:["Berorientasi Pelayanan","Loyal","Kolaboratif","Kompeten"],
answer:0,
point:3,
explain:"ASN harus tetap mengutamakan pelayanan publik."
},
{
q:"ASN mengikuti pelatihan digital untuk meningkatkan kemampuan kerja.",
options:["Harmonis","Kompeten","Loyal","Akuntabel"],
answer:1,
point:3,
explain:"Kompeten berarti terus belajar dan mengembangkan kapasitas."
}
];

// Tambah otomatis hingga 30 soal
while(questions.length < 30){
questions.push({
q:"Contoh penerapan nilai BerAKHLAK dalam pekerjaan sehari-hari adalah...",
options:[
"Bekerja asal selesai",
"Menolak kerja sama",
"Mengutamakan integritas dan pelayanan",
"Menghindari tanggung jawab"
],
answer:2,
point:3,
explain:"ASN harus mengutamakan integritas, pelayanan, dan profesionalisme."
});
}

let timer;
let timeLeft = 1800;

function startQuiz(){

const nama = document.getElementById("nama").value.trim();

if(nama === ""){
alert("Silakan isi nama terlebih dahulu.");
return;
}

document.getElementById("startSection").style.display = "none";
document.getElementById("quizSection").style.display = "block";

renderQuestions();

timer = setInterval(updateTimer,1000);

}

function updateTimer(){

let minutes = Math.floor(timeLeft / 60);
let seconds = timeLeft % 60;

document.getElementById("timer").innerHTML =
String(minutes).padStart(2,'0') + ":" + String(seconds).padStart(2,'0');

timeLeft--;

if(timeLeft < 0){
clearInterval(timer);
finishQuiz();
}

}

function renderQuestions(){

let html = "";

questions.forEach((q,index)=>{

html += `
<div class="question">

<h3>Soal ${index+1}</h3>

<p>${q.q}</p>

`;

q.options.forEach((opt,i)=>{

html += `
<label>
<input type="radio" name="q${index}" value="${i}">
${opt}
</label><br>
`;

});

html += `
<p><b>Poin:</b> ${q.point}</p>
</div>
`;

});

document.getElementById("questions").innerHTML = html;

}

function finishQuiz(){

clearInterval(timer);

let score = 0;
let review = "";

questions.forEach((q,index)=>{

const selected = document.querySelector(`input[name="q${index}"]:checked`);

let userAnswer = selected ? parseInt(selected.value) : -1;

if(userAnswer === q.answer){
score += q.point;

review += `
<div class="correct">
<b>Soal ${index+1} Benar</b><br>
Pembahasan: ${q.explain}
</div>
`;
}else{

review += `
<div class="wrong">
<b>Soal ${index+1} Salah</b><br>
Jawaban benar: ${q.options[q.answer]}<br>
Pembahasan: ${q.explain}
</div>
`;

}

});

const nama = document.getElementById("nama").value;
const nip = document.getElementById("nip").value;
const unitkerja = document.getElementById("unitkerja").value;

fetch("https://script.google.com/macros/s/AKfycbxttHX3di8BhddMvPqH2NQ7IZcPviUc5Ycak1-IC6IOhuvi5fDEVBizFebem07k5Xp4yg/exec", {
method: "POST",
headers: {
"Content-Type":"application/json"
},
body: JSON.stringify({
nama:nama,
nip:nip,
unitkerja:unitkerja,
nilai:score,
benar:"-",
total:questions.length
})
});

document.getElementById("quizSection").style.display = "none";

document.getElementById("resultBox").style.display = "block";

document.getElementById("resultBox").innerHTML = `
<h2>Hasil Kuis</h2>
<h1>${score}/100</h1>
${review}
`;

}

</script>

</body>
</html>
